<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Insulleads CRM</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2em auto; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center; }
    nav a { margin-right: 1em; }
    h1, h2 { color: #1a3a6c; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; }
    th, td { border-bottom: 1px solid #eee; padding: 6px 10px; text-align: left; font-size: 14px; }
    th { background: #f5f7fa; }
    .pill { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #eef; }
    .stage-DISCOVERED { background: #eef; }
    .stage-QUALIFIED { background: #ffe; }
    .stage-READY_TO_CONTACT { background: #efe; }
    .stage-CONTACTED { background: #def; }
    .stage-REPLIED { background: #cfc; }
    .stage-WON { background: #cfc; font-weight: bold; }
    .stage-LOST { background: #fcc; }
  </style>
</head>
<body>
  <header>
    <h1>🏗️ Insulleads CRM</h1>
    <nav>
      <a href="{% url 'crm:dashboard' %}">Dashboard</a>
      <a href="/admin/">Admin</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
